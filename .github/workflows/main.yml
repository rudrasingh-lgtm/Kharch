name: Build Website to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build APK
      run: |
        # यह आपके लाइव URL को एक सुरक्षित और फ़ास्ट APK (TWA) में बदल देगा
        bubblewrap init --manifest="https://github.io" --meta --rules || true
        bubblewrap build --yes || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kharch-diary-app
        path: ./*.apk
