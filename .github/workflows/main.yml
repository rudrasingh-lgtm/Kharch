name: Build Website to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova App
      run: |
        cordova create myapp com.rudrasingh.kharch "KharchDiary"
        cd myapp
        cordova platform add android
        rm -rf www/*
        cp -r ../* www/ || true

    - name: Build Android APK
      run: |
        cd myapp
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kharch-diary-apk
        path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
