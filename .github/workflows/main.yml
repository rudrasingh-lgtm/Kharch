name: Build Website to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Web APK using Gh-Action
      uses: dynamicw/action-website-to-apk@v1.0.0
      with:
        url: 'https://github.io'
        title: 'Kharch Diary'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kharch-diary-apk
        path: ./*.apk
