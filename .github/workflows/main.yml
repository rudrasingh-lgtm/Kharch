name: Build Website to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize Web Android Project
      run: |
        # यह आपके लाइव यूआरएल को लोड करने के लिए एक नेटिव एंड्रॉइड स्ट्रक्चर तैयार करेगा
        mkdir -p app/src/main/java/com/rudrasingh/kharch
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        
        # Build Gradle फ़ाइल बनाना
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # App Build Gradle फ़ाइल बनाना
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.rudrasingh.kharch'
            compileSdk 34
            defaultConfig {
                applicationId "com.rudrasingh.kharch"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # Android Manifest फ़ाइल (इंटरनेट परमिशन के साथ)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Kharch Diary" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity Java कोड जो सीधे आपका URL खोलेगा
        cat << 'EOF' > app/src/main/java/com/rudrasingh/kharch/MainActivity.java
        package com.rudrasingh.kharch;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void Bundle(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("https://github.io");
                setContentView(webView);
            }
        }
        EOF

        # Settings Gradle फ़ाइल
        echo "include ':app'" > settings.gradle

    - name: Build Android APK
      run: gradle app:assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kharch-diary-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
