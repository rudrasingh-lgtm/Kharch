name: Build Website to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Convert URL to APK
      uses: cemcoe/web-to-apk-action@v1.2.1
      with:
        url: https://rudrasingh-lgtm.github.io/Kharch/
        app_name: 'Kharch Diary'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kharch-diary-apk
        path: ./*.apk
