name: Build Website to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Web APK
      uses: visualon/web-to-apk-action@v1
      with:
        url: 'https://github.io'
        app-name: 'Kharch Diary'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kharch-diary-apk
        path: ./*.apk
